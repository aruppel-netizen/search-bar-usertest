<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поисковая строка</title>
  <link rel="stylesheet" href="./kit/styles.css">
  <style>
    body { margin: 0; font-family: Lato, Arial, sans-serif; background: var(--background-secondary); }
    .page { min-height: 100vh; background: var(--background-secondary); color: var(--text-primary-default); }
    .container { max-width: 1040px; margin: 0 auto; padding: 0 var(--unit_4); box-sizing: border-box; }
    /* Шапка и фильтры по макету: 1440 с полями 56 */
    .wide { max-width: 1440px; margin: 0 auto; padding: 0 56px; box-sizing: border-box; }

    /* ── Шапка: как на проде cian.ru (header-frontend) ── */
    .topbar { position: sticky; top: 0; z-index: 30; transition: transform .25s ease; }
    .topbar--hidden { transform: translateY(-100%); }
    .topbar--pinned { box-shadow: 0 4px 16px rgba(13, 22, 46, .08); }
    .header { position: relative; z-index: 10; background: var(--background-elevation); border-bottom: 1px solid var(--stroke-border-default); }
    .header__inner { max-width: 1376px; margin: 0 auto; padding: 0 20px; box-sizing: border-box; display: flex; }
    .header__logo { display: flex; align-items: center; flex-shrink: 0; width: 110px; height: 67px; }
    .header__logo svg { display: block; }
    .header__user { display: flex; align-items: center; flex-shrink: 0; margin-left: auto; }
    .header__gpt { display: flex; align-items: center; gap: 8px; height: 28px; margin-right: 13px; padding: var(--unit_1) var(--unit_3); border: 0; border-radius: 16px; background: var(--background-secondary); cursor: pointer; }
    .header__gpt:hover { background: var(--surface-main-default); }
    .header__utilities { display: flex; gap: 8px; margin-right: 23px; }
    .header__utility { position: relative; display: flex; padding: 6px; border-radius: 16px; color: var(--icon-main-default); text-decoration: none; }
    .header__utility:hover { background: var(--surface-main-default); }
    .header__utility--unread::after { content: ""; position: absolute; top: 3px; left: 16px; width: 8px; height: 8px; box-sizing: border-box; border-radius: 8px; background: var(--accent-negative-primary); border: 1px solid var(--stroke-border-neutral); }
    .header__place { margin-right: 16px; }
    .header__nav { display: flex; flex: 1; min-width: 0; }
    .header__list { display: flex; flex-shrink: 0; margin: 0; padding: 0; list-style: none; }
    .header__link { position: relative; display: flex; align-items: center; height: 100%; padding: 16px 40px 16px 0; color: var(--text-primary-default); font-size: 14px; line-height: 20px; font-weight: 700; text-decoration: none; cursor: pointer; white-space: nowrap; }
    .header__item--hovered .header__link::after,
    .header__item--active .header__link::after { content: ""; position: absolute; bottom: 0; width: calc(100% - 40px); height: 3px; }
    .header__item--hovered .header__link::after { background: var(--surface-neutral-pressed); }
    .header__item--active .header__link::after { background: var(--accent-main-primary); }
    .header__promo { display: flex; align-items: center; gap: var(--unit_1); min-width: 0; overflow: hidden; white-space: nowrap; color: var(--text-primary-default); font-size: 14px; line-height: 20px; font-weight: 700; text-decoration: none; }
    .header__promo img { width: 16px; height: 16px; }

    /* Выпадающие разделы (DropdownInner) */
    .header__dropdown { position: absolute; top: 100%; left: 0; right: 0; background: var(--background-elevation); border-top: 1px solid var(--stroke-border-default); box-shadow: 0 8px 16px var(--shadow-default); }
    .dropdown { max-width: 1376px; margin: 0 auto; padding: 48px 20px 0 178px; box-sizing: border-box; }
    .dropdown__columns { display: grid; grid-template-columns: repeat(3, minmax(277px, 322px)); column-gap: 40px; align-items: start; }
    .dropdown__column { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
    .dropdown__item { display: block; margin: 0 24px 11px 0; padding-top: 9px; }
    .dropdown__content { display: flex; align-items: center; color: var(--text-primary-default); font-size: 16px; line-height: 22px; text-decoration: none; }
    a.dropdown__content:hover { color: var(--text-main-hovered); }
    .dropdown__content--bold { font-size: 18px; line-height: 24px; font-weight: 700; }
    .dropdown__content--title { cursor: default; }
    .dropdown__icon { flex-shrink: 0; margin-right: 8px; color: var(--icon-primary-default); }
    .dropdown__badge { margin-left: 8px; font-weight: 400; }
    .dropdown__bottom { display: flex; flex-wrap: wrap; margin: 24px 0 0; padding: 0; list-style: none; border-top: 1px solid var(--stroke-divider-default); }
    .dropdown__bottom li { display: inline-flex; margin-right: 24px; }
    .dropdown__bottom a { padding: 24px 0; color: var(--text-secondary-default); font-size: 14px; line-height: 20px; text-decoration: none; }
    .dropdown__bottom a:hover, .dropdown__bottom a.dropdown__bottom-link--highlighted { color: var(--control-main-primary-pressed); }

    /* ── Фильтры (Figma: Перевод компонентов веб, Filters sell 667:108600) ── */
    .filters { position: relative; z-index: 2; background: var(--background-primary); border-bottom: 1px solid var(--stroke-divider-default); }
    .filters__line { display: flex; align-items: center; gap: var(--unit_3); padding-top: var(--unit_4); padding-bottom: var(--unit_4); }
    .filters__owner { flex: none; white-space: nowrap; }
    .filters__search { flex: 1 1 0; min-width: 240px; }
    .filters__search-icon { display: flex; padding-left: var(--unit_3); padding-right: var(--unit_2); }
    .filters__geo { display: flex; align-items: center; padding-right: var(--unit_3); }
    .filters__geo > * + * { margin-left: var(--unit_3); padding-left: var(--unit_3); border-left: 1px solid var(--stroke-divider-default); }
    .filters__save { flex: none; margin-left: auto; white-space: nowrap; }
    .filters__query input { text-overflow: ellipsis; }

    /* ── Мультиселект типа (Figma: Перевод компонентов веб, Type 667:109508) ──
       Сетка — вариант deal=Снять: чекбокс кита 20px, текст 16/24, шаг строк 16, поля 12, ширина 300 */
    /* Попапы по тапу на чипс (Figma: Ready for dev → Быстрые фильтры): ширина по содержимому, радиус 8 */
    .ms { box-sizing: border-box; width: max-content; min-width: 200px; max-width: 320px; max-height: 500px; overflow-y: auto; margin-top: var(--unit_2); padding: var(--unit_3); display: flex; flex-direction: column; gap: var(--unit_4); background: var(--background-elevation); border: 1px solid var(--stroke-border-neutral); border-radius: 8px; box-shadow: 0 -2px 8px var(--shadow-default); }
    .ms--compact { gap: var(--unit_3); }
    .ms__row { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--unit_2); }
    .ms__info { display: flex; padding-top: 4px; }
    .ms__divider { flex: none; height: 1px; background: var(--stroke-divider-default); }
    .ms__link { display: flex; align-items: center; justify-content: space-between; gap: var(--unit_2); padding: 0 0 var(--unit_1); border: 0; background: none; cursor: pointer; font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-main-default); text-align: left; }
    .ms__link:hover { color: var(--text-main-hovered); }

    /* Сделка: Купить ✓ / Снять / Посуточно + ссылка */
    .ms__opt { display: flex; align-items: center; justify-content: space-between; gap: var(--unit_4); min-width: 147px; padding: 0; border: 0; background: none; cursor: pointer; font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-primary-default); text-align: left; }
    .ms__opt:hover { color: var(--text-main-default); }
    .ms__opt-check { display: flex; width: 16px; height: 16px; }
    .ms--deal { min-width: 0; }

    /* Комнатность чипсами (tooltip_rooms2) и цена (tooltip_price, Popover) */
    .pop { box-sizing: border-box; margin-top: var(--unit_2); background: var(--background-primary); border: 1px solid var(--stroke-border-neutral); box-shadow: 0 8px 16px rgba(0, 0, 0, .08); }
    .pop--rooms { width: 380px; padding: var(--unit_4); border-radius: 8px; }
    .pop--price { width: 305px; padding: var(--unit_4); border-radius: 12px; display: flex; flex-direction: column; gap: var(--unit_2); }
    .pop--price-compact { width: 301px; padding: var(--unit_1) 0; border-radius: 4px; background: var(--background-elevation); }
    .pop__row { display: flex; align-items: center; gap: var(--unit_2); }
    .pop--price-compact .pop__row { padding: var(--unit_2) var(--unit_3); }
    .pop__row > div { flex: 1 1 0; min-width: 0; }
    .pop__row > .pop__link { flex: none; }
    /* Переключатель «за всё / за м²»: чипсы, склеенные в группу */
    .seg { display: flex; }
    .seg__btn { position: relative; flex: 1 1 0; height: 44px; padding: 10px 16px; border: 1px solid var(--stroke-divider-default); background: var(--background-primary); font: 400 16px/22px Lato, Arial, sans-serif; color: var(--text-primary-default); cursor: pointer; }
    .seg__btn:first-child { border-radius: 8px 0 0 8px; }
    .seg__btn:last-child { margin-left: -1px; border-radius: 0 8px 8px 0; }
    .seg__btn[aria-pressed="true"] { z-index: 1; background: var(--surface-inverted-selected); border-color: var(--stroke-control-selected); }

    /* ── Мультиселект категории (Figma: Type, deal=Категория / Категория2) ── */
    .cat { box-sizing: border-box; width: 300px; max-height: 416px; margin-top: var(--unit_2); padding: var(--unit_3) 0; display: flex; flex-direction: column; gap: var(--unit_2); background: var(--background-elevation); border: 1px solid var(--stroke-border-neutral); border-radius: 4px; box-shadow: 0 -2px 8px var(--shadow-default); }
    .cat__search { flex: none; padding: 0 var(--unit_3) var(--unit_3); border-bottom: 1px solid var(--stroke-divider-default); }
    .cat__list { min-height: 0; overflow-y: auto; }
    .cat__row { display: flex; align-items: center; gap: var(--unit_4); min-height: 40px; padding: var(--unit_2) var(--unit_3); box-sizing: border-box; }
    .cat__row--child { padding-left: 40px; }
    .cat__check { display: flex; flex: 1; min-width: 0; align-items: center; gap: var(--unit_2); cursor: pointer; }
    .cat__toggle { display: flex; padding: 0; border: 0; background: none; cursor: pointer; }
    .cat__empty { padding: var(--unit_2) var(--unit_3); }

    /* ── Все фильтры (Figma: Все фильтры, ModalWindow_Desktop 880): подпись 140 справа, варианты 652, строки через 32 ── */
    .af { display: flex; flex-direction: column; gap: 32px; }
    .af__row { display: flex; align-items: flex-start; gap: 24px; }
    .af__label { flex: none; width: 140px; display: flex; justify-content: flex-end; align-items: flex-start; gap: var(--unit_1); padding-top: 10px; text-align: right; }
    .af__row--checks .af__label { padding-top: 0; }
    .af__info { display: flex; padding-top: 4px; }
    .af__variants { flex: 1 1 0; min-width: 0; max-width: 652px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; }
    .af__variants > [class*="chips"], .af__variants > div:not([class^="af__"]) { gap: 8px; }
    .af__sub, .af__full { flex-basis: 100%; }
    .af__sub + * { margin-top: -4px; }
    .af__range { display: flex; align-items: center; gap: 8px; }
    .af__pair { display: flex; gap: 4px; width: 136px; }
    .af__pair--wide { width: 244px; }
    .af__pair > * { flex: 1 1 0; min-width: 0; }
    .af__price { display: flex; flex-wrap: wrap; gap: 8px; }
    .af__price .seg { width: 200px; }
    .af__checks { display: flex; flex-wrap: wrap; gap: 8px 24px; }
    .af__checks--desc { max-width: 450px; }
    .af__metro { width: 220px; }
    .af__metro [class*="adornment"], .af__metro span { white-space: nowrap; }
    .af__date { width: 200px; }
    .af__select { display: flex; align-items: center; gap: 8px; }
    .af__words { display: flex; gap: 8px; }
    .af__words-input, .af__input { width: 320px; }
    .af__footer { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--unit_2); }
    /* Подвал ModalWindow_Desktop отделён линией 0.5px */
    .af-modal [class*="Modal_footer"] { border-top: 0.5px solid var(--stroke-divider-default); }
    @media (max-width: 720px) {
      .af__row { flex-direction: column; gap: 8px; }
      .af__label { width: auto; justify-content: flex-start; padding-top: 0; text-align: left; }
      .af__label > * { text-align: left !important; }
    }

    /* ── Регион · Район · Метро (вид с прода): модалки на Modal кита ── */
    .filters__tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: var(--unit_4); }
    /* Теги кита — отдельный блок; растворяем его, чтобы «Очистить» шла сразу за последним тегом */
    .filters__tags > [class*="tags"] { display: contents; }
    .filters__reset { margin-left: 8px; }
    .filters__tags [class*="Tag"] { max-width: 260px; }
    .filters__reset { padding: 4px 0; border: 0; background: none; color: var(--text-main-default); font: 700 14px/20px Lato, Arial, sans-serif; cursor: pointer; }
    .filters__reset:hover { color: var(--text-main-hovered, var(--text-main-default)); }
    /* Чипсы не сжимаются — ужимается только поиск; длинные подписи уходят в многоточие (maxWidth у кнопок) */
    .filters__line { position: relative; }
    .filters__line > *:not(.filters__query) { flex-shrink: 0; }
    .filters__save-icon { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 8px; background: none; cursor: pointer; }
    .filters__save-icon:hover { background: var(--surface-main-default); }
    .filters__query.sbox--collapsed { flex: 0 0 40px; min-width: 40px; max-width: 40px; }
    .filters--l4 .filters__line { flex-wrap: wrap; }
    /* Адаптив: сначала ужимается поиск (520 → 360), потом сворачиваются чипсы; освободившееся после свёртки место забирает поиск (без дыр в строке) */
    .sbox__mini { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--stroke-control-default); border-radius: 8px; background: var(--background-primary); cursor: pointer; }
    .sbox__mini:hover { border-color: var(--stroke-control-hovered, var(--stroke-control-default)); }
    .sbox__mini--on { border-color: transparent; background: var(--accent-main-secondary); }
    .sbox--collapsed.sbox--open .sbox__field { position: absolute; top: 0; left: 0; width: var(--focus-w, 400px); }
    .sbox--collapsed.sbox--open .sbox__layer { right: auto; width: calc(var(--focus-w, 400px) + 24px); }
    .geo-head { display: flex; flex-direction: column; gap: var(--unit_2); }
    .geo-search { width: 400px; max-width: 100%; }
    .geo-crumbs { display: flex; align-items: center; gap: var(--unit_1); }
    .geo-crumbs__item { padding: 0; border: 0; background: none; font: 400 12px/16px Lato, Arial, sans-serif; color: var(--text-secondary-default); cursor: pointer; }
    button.geo-crumbs__item:hover { color: var(--text-main-hovered); }
    .geo-crumbs__item--current { cursor: default; }
    .geo-top { display: flex; flex-wrap: wrap; gap: var(--unit_2) var(--unit_6); margin-bottom: var(--unit_8); }
    .geo-top__link { padding: 0; border: 0; background: none; font: 400 16px/22px Lato, Arial, sans-serif; color: var(--text-primary-default); cursor: pointer; }
    .geo-top__link:hover { color: var(--text-main-hovered); }
    .geo-cols { columns: 4 220px; column-gap: var(--unit_6); }
    .geo-block { break-inside: avoid; padding-bottom: var(--unit_6); }
    .geo-letter { margin-bottom: var(--unit_2); font: 400 16px/22px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .geo-item { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 4px -8px; padding: 0 8px; border: 0; border-radius: 99px; background: none; font: 400 14px/24px Lato, Arial, sans-serif; color: var(--text-primary-default); text-align: left; cursor: pointer; }
    .geo-item:hover { color: var(--text-main-hovered); }
    .geo-item--on, .geo-item--on:hover { background: var(--control-main-primary-default); color: var(--text-inverted-default); }
    .geo-okrug { padding: 0; border: 0; background: none; font: 400 18px/24px Lato, Arial, sans-serif; color: var(--text-primary-default); text-align: left; cursor: pointer; }
    .geo-okrug:hover, .geo-okrug--on { color: var(--text-main-default); }
    .geo-okrug__sub { margin: 5px 0 10px; font: italic 400 14px/18px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .geo-quick { display: flex; flex-wrap: wrap; gap: var(--unit_2); }
    .geo-footer { display: flex; justify-content: center; }
    .metro-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--unit_3); padding-right: var(--unit_6); }
    .metro-head__dist, .metro-head__quick { display: flex; align-items: center; gap: var(--unit_2); }
    .metro-head__select { width: 150px; }
    .metro-head__min { width: 64px; }
    .metro-scroll { height: calc(100vh - 260px); min-height: 320px; overflow: auto; }
    .metro-loading { display: grid; place-items: center; height: 100%; }
    /* Схема 1480×2340: фон с CDN, станции и подписи поверх по координатам из данных прода */
    .metro-map { position: relative; }
    .metro-map__bg { position: absolute; max-width: none; border-radius: 4px; }
    .metro-pin { position: absolute; box-sizing: border-box; padding: 2px; border-style: solid; border-radius: 50%; background: #fff; cursor: pointer; transition: border .2s ease-out, background-color .2s ease-out; }
    .metro-pin--on { background: var(--control-main-primary-default); border-color: #fff; }
    .metro-name { position: absolute; padding: 0 2px; border-radius: 4px; background: rgba(255, 255, 255, .6); line-height: 1.3; white-space: pre; cursor: pointer; user-select: none; }
    .metro-name--on { background: var(--control-main-primary-default); color: #fff; }
    .metro-line { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 700; line-height: 1; cursor: pointer; }
    .metro-line--round { border-radius: 50%; }

    /* ── Поисковая строка в шапке фильтров (Figma 1415:49555 / 1415:49557) ── */
    .filters__query { position: relative; flex: 1 1 440px; min-width: 360px; max-width: 520px; }
    .filters__geo-chip { position: relative; flex: none; display: inline-flex; }
    .filters__all { position: relative; flex: none; display: inline-flex; }
    .filters__all-dot { position: absolute; top: 10px; left: 28px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-negative-primary); pointer-events: none; }
    .filters__geo-dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border: 2px solid var(--background-primary); border-radius: 50%; background: var(--control-main-primary-default); }
    .sbox__actions { display: flex; align-items: center; gap: 4px; margin-right: 6px; }
    .sbox__clear { display: flex; align-items: center; padding: 4px; border: 0; border-radius: 50%; background: none; cursor: pointer; }
    .sbox__clear:hover { background: var(--surface-neutral-default); }
    .sbox__find { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: var(--control-main-primary-default); color: #fff; font: 700 14px/20px Lato, Arial, sans-serif; cursor: pointer; }
    .sbox__find:hover { background: var(--control-main-primary-hovered, var(--control-main-primary-default)); }
    /* Активный поиск (как на Озоне): затемнение, белая плашка вокруг поля с чипсами, ниже — карточка подсказок */
    body.search-active .filters { z-index: 40; }
    .sbox--open { z-index: 2; }
    .sbox__field { position: relative; z-index: 2; }
    /* В раскрытом поиске поле тянется на всю ширину белой плашки — без пустоты справа */
    /* Ширина поля в фокусе: не меньше --focus-w = 400 px (для сравнения — ?focusw=480 и т.п.) */
    .sbox--open .sbox__field { width: max(100%, var(--focus-w, 400px)); }
    .sbox__overlay { position: fixed; inset: 0; z-index: 0; background: rgba(4, 16, 41, .48); animation: sbox-fade .15s ease-out; }
    .sbox__layer { position: absolute; z-index: 1; top: -12px; left: -12px; width: max(calc(100% + 24px), calc(var(--focus-w, 400px) + 24px)); display: flex; flex-direction: column; gap: 12px; }
    .sbox__panel { padding: 12px; background: var(--background-elevation); border-radius: 16px; }
    .sbox__spacer { height: 44px; }
    .sbox__chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; max-height: 124px; overflow: hidden; } /* 3 строки × 36 + 2 × 8 */
    /* Чипс — компонент «Chat Button» (Figma 1527:60348): Default — Surface/Neutral/Default, Hover и Pressed — Surface/Main/Default;
       Heading5 14/20, паддинги 8/12, радиус 20; Pressed ужимается до 32 px (6/10) — внешний отступ 2 px держит высоту строки */
    .sbox__chip { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; border: 0; border-radius: 20px; background: var(--surface-neutral-default); color: var(--text-primary-default); font: 700 14px/20px Lato, Arial, sans-serif; cursor: pointer; }
    .sbox__chip:hover { background: var(--surface-main-default, #e6f0ff); }
    .sbox__chip:active { height: 32px; margin: 2px; padding: 0 10px; background: var(--surface-main-default, #e6f0ff); }
    .sbox__drop--empty { display: grid; place-items: center; min-height: 88px; padding: 20px 24px; text-align: center; font: 700 16px/24px Lato, Arial, sans-serif; color: var(--text-secondary-default); text-wrap: balance; }
    .sbox__hint { display: flex; align-items: center; gap: 8px; margin: 0 8px 4px; padding: 10px 12px; border-radius: 8px; background: var(--accent-main-secondary, #e6f0ff); font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .empty { padding-top: 8px; }
    .empty__block { display: flex; gap: 24px; align-items: flex-start; margin: 16px 0 48px; }
    .empty__img { flex: none; width: 80px; height: 80px; }
    .empty__body { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .empty__title { font: 700 18px/24px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .empty__tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .empty__tag { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 6px 0 12px; border-radius: 99px; background: var(--accent-main-secondary, #e6f0ff); font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-primary-default); white-space: nowrap; }
    .empty__tag-n { color: var(--text-main-default, #0468ff); }
    .empty__tag-x { display: flex; padding: 2px; border: 0; border-radius: 50%; background: none; cursor: pointer; }
    .empty__tag-x:hover { background: rgba(0, 0, 0, .06); }
    .empty__reset { padding: 0 4px; border: 0; background: none; font: 700 14px/20px Lato, Arial, sans-serif; color: var(--text-main-default, #0468ff); cursor: pointer; }
    .empty__more { margin: 0 0 8px; font: 700 22px/28px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .mapview__empty { position: absolute; z-index: 650; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 16px; max-width: calc(100% - 32px); padding: 16px 20px; border-radius: 16px; background: var(--background-primary); box-shadow: 0 8px 24px rgba(13, 22, 46, .16); }
    .mapview__empty-title { font: 700 16px/24px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .mapview__empty-sub { font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-secondary-default); }
    .sbox__drop { max-height: calc(100vh - 260px); overflow-y: auto; padding: 8px 0; background: var(--background-elevation); border-radius: 16px; box-shadow: 0 8px 24px rgba(0, 0, 0, .12); }
    .sbox__row { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 16px; cursor: pointer; box-sizing: border-box; }
    .sbox__row--cat { min-height: 60px; }
    .sbox__row--active { background: var(--surface-neutral-default); }
    .sbox__row { position: relative; }
    .sbox__row:not(:last-child)::after { content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; height: 1px; background: var(--stroke-divider-default); }
    .sbox__ico { display: flex; flex: none; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 12px; background: var(--surface-neutral-default); }
    .sbox__logo { flex: none; width: 24px; height: 24px; border-radius: 4px; object-fit: cover; }
    .sbox__tile { display: flex; flex: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface-neutral-default); }
    .sbox__tile--cat { width: 44px; height: 44px; background: var(--surface-main-default); }
    .sbox__text { display: flex; flex: 1 1 auto; flex-direction: column; min-width: 0; }
    .sbox__title { font: 400 16px/24px Lato, Arial, sans-serif; color: var(--text-primary-default); overflow-wrap: anywhere; }
    .sbox__title b { font-weight: 700; }
    .sbox__sub { font: 400 12px/16px Lato, Arial, sans-serif; color: var(--text-secondary-default); }

    .sbox__fill { display: flex; flex: none; padding: 8px; border: 0; border-radius: 50%; background: none; color: var(--icon-secondary-default); cursor: pointer; transform: rotate(-90deg); }
    .sbox__fill:hover { background: var(--surface-neutral-pressed, var(--surface-neutral-default)); color: var(--icon-main-default); }
    @keyframes sbox-fade { from { opacity: 0; } }

    /* ── Единое окно «Адрес, метро, район» ── */
    .gm-head { display: flex; flex-direction: column; gap: var(--unit_3); padding-right: var(--unit_6); }
    .gm-search { position: relative; z-index: 5; width: 425px; max-width: 100%; }
    .gsug { position: absolute; top: calc(100% + 4px); left: 0; width: 100%; max-height: 360px; overflow-y: auto; box-sizing: border-box; padding: 8px 0; background: var(--background-elevation); border: 1px solid var(--stroke-divider-default); border-radius: 12px; box-shadow: 0 8px 16px rgba(0, 0, 0, .08); }
    .gsug__group + .gsug__group { margin-top: 4px; }
    .gsug__title { display: flex; align-items: center; gap: 8px; padding: 8px 16px 4px; font: 700 12px/16px Lato, Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; color: var(--text-secondary-default); }
    .gsug__row { display: flex; align-items: center; gap: 8px; padding: 6px 16px 6px 40px; cursor: pointer; }
    .gsug__row--on { background: var(--surface-main-default); }
    .gsug__text { display: flex; flex: 1 1 auto; flex-direction: column; min-width: 0; }
    .gsug__main { overflow: hidden; font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-primary-default); white-space: nowrap; text-overflow: ellipsis; }
    .gsug__main b { font-weight: 700; }
    .gsug__main--bold { font-weight: 700; }
    .gsug__main--wrap { white-space: normal; }
    .gsug__sub { overflow: hidden; font: 400 12px/16px Lato, Arial, sans-serif; color: var(--text-secondary-default); white-space: nowrap; text-overflow: ellipsis; }
    .gsug__link { display: flex; flex: none; padding: 4px; }
    .gsug__empty { padding: 8px 16px; font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-secondary-default); }
    .gm-search input::placeholder { color: var(--text-disabled-default, #b8c1d6); }
    /* Окно гео одного размера на всех вкладках и в поиске: тело фиксированной высоты, лишнее прокручивается внутри */
    .gm-body { height: min(600px, calc(100vh - 300px)); overflow-y: auto; margin: 0 -8px; padding: 0 8px; }
    .gm-body--metro { display: flex; flex-direction: column; overflow: hidden; }
    .gm-body--metro .metro-scroll { flex: 1 1 auto; height: auto; min-height: 0; }
    .gm-crumbs { margin-bottom: var(--unit_4); }
    .gm-quick { margin-bottom: var(--unit_6); }
    .gm-metro-head { margin-bottom: var(--unit_3); padding-right: 0; }
    .gm-results { display: flex; flex-direction: column; gap: var(--unit_6); }
    .gm-found__title { margin-bottom: var(--unit_2); font: 700 14px/20px Lato, Arial, sans-serif; color: var(--text-secondary-default); }
    .gm-found__items { display: flex; flex-wrap: wrap; gap: 0 var(--unit_4); }
    .gm-found__items .geo-item { margin-left: 0; }
    .gm-metro-dot { display: inline-flex; margin-right: 2px; }
    .gm-found__title--icon { display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; }
    .gm-jk { display: flex; flex-direction: column; margin: 0 -12px; }
    .gm-jk__row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .gm-jk__row:hover, .gm-jk__row--on { background: var(--surface-main-default); }
    .gm-jk__text { display: flex; flex: 1 1 auto; flex-direction: column; min-width: 0; }
    .gm-jk__name { font: 400 16px/22px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .gm-jk__addr { overflow: hidden; font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-secondary-default); white-space: nowrap; text-overflow: ellipsis; }
    .gm-jk__check, .gm-jk__open { display: flex; flex: none; padding: 4px; }
    .gm-hw { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--unit_6) var(--unit_4); }
    .gm-hw__group { display: flex; flex-direction: column; align-items: flex-start; }
    .gm-hw__dir { margin-bottom: var(--unit_2); padding: 0; border: 0; background: none; font: 700 14px/20px Lato, Arial, sans-serif; color: var(--text-secondary-default); cursor: pointer; }
    .gm-hw__dir:hover, .gm-hw__dir[aria-pressed="true"] { color: var(--text-main-default); }
    .gm-footer { display: flex; align-items: center; justify-content: center; gap: 14px; width: 100%; }
    .gm-footer > :first-child { min-width: 193px; }
    .gm-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; height: 100%; min-height: 240px; text-align: center; }
    .gm-notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-main-default, #e6f0ff); font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .gm-notice__undo { flex: none; padding: 0; border: 0; background: none; font: 700 14px/20px Lato, Arial, sans-serif; color: var(--text-main-default); cursor: pointer; }
    .gm-dlists { display: flex; flex-direction: column; gap: var(--unit_6); }
    .gm-summary { flex: 1 1 auto; min-width: 0; }
    .gm-footer__actions { display: flex; flex: none; gap: var(--unit_2); }

    /* ── Сниппеты (Figma 1415:49943) ── */
    .results { max-width: 1440px; margin: 0 auto; padding: var(--unit_6) 32px var(--unit_8); box-sizing: border-box; }
    .results__head { padding: 0 24px; }
    .results__list { display: flex; flex-direction: column; gap: 8px; }
    .snip { position: relative; display: flex; gap: 32px; align-items: flex-start; padding: 24px; background: var(--background-primary); border-radius: 16px; color: var(--text-primary-default); }
    .snip__photo { display: flex; flex: none; flex-direction: column; gap: 4px; width: 375px; height: 332px; border-radius: 12px; overflow: hidden; }
    .snip__photo--single { width: 276px; }
    .snip__main { position: relative; flex: 1 1 auto; min-height: 0; background: var(--surface-neutral-default); cursor: pointer; }
    .snip__main img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .snip__dots { position: absolute; left: 12px; right: 12px; bottom: 8px; display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
    .snip__dots span { flex: 1; height: 2px; border-radius: 1px; background: rgba(255, 255, 255, .5); }
    .snip__dots span.on { background: #fff; }
    .snip__main:hover .snip__dots { opacity: 1; }
    .snip__video { position: absolute; top: 16px; right: 16px; display: flex; padding: 4px; border-radius: 4px; background: var(--overlay-default, rgba(0, 0, 0, .4)); }
    .snip__count { position: absolute; right: 16px; bottom: 16px; padding: 4px; border-radius: 4px; background: var(--overlay-default, rgba(0, 0, 0, .4)); color: #fff; font: 400 12px/16px Lato, Arial, sans-serif; }
    .snip__main:hover .snip__count { bottom: 20px; }
    .snip__extra { display: flex; flex: none; gap: 4px; height: 78px; }
    .snip__thumb { position: relative; flex: 1 1 0; min-width: 0; padding: 0; border: 0; background: var(--surface-neutral-default); cursor: pointer; }
    .snip__thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .snip__thumb::after { content: ''; position: absolute; inset: 0; background: rgba(0, 0, 0, .04); }
    .snip__thumb--more::after { background: var(--overlay-default, rgba(0, 0, 0, .4)); }
    .snip__thumb--more span { position: relative; z-index: 1; color: #fff; font: 400 14px/20px Lato, Arial, sans-serif; }
    .snip__info { display: flex; flex: 1 1 0; flex-direction: column; gap: 16px; min-width: 0; }
    .snip__title { display: flex; flex-direction: column; gap: 4px; }
    .snip__name { font: 700 22px/28px Lato, Arial, sans-serif; color: var(--text-main-default); text-decoration: none; }
    .snip__name:hover { color: var(--text-main-hovered, var(--text-main-default)); }
    .snip__sub { font: 700 16px/24px Lato, Arial, sans-serif; white-space: pre; }
    .snip__badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .snip__badge { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; border-radius: 99px; background: var(--accent-ghost-secondary); color: var(--text-primary-default); font: 400 14px/20px Lato, Arial, sans-serif; white-space: nowrap; }
    .snip__badge svg { margin-left: -2px; }
    .snip__geo { display: flex; flex-direction: column; gap: 4px; font: 400 14px/20px Lato, Arial, sans-serif; }
    .snip__metro { display: flex; gap: 8px; }
    .snip__metro-name { display: inline-flex; align-items: center; gap: 4px; }
    .snip__address, .snip__price-note { color: var(--text-primary-pressed); }
    .snip__price { display: flex; flex-direction: column; gap: 4px; }
    .snip__price-main { font: 700 22px/28px Lato, Arial, sans-serif; letter-spacing: -.5px; }
    .snip__price-note { font: 400 14px/20px Lato, Arial, sans-serif; }
    .snip__text { display: -webkit-box; margin: 0; padding-top: 12px; overflow: hidden; -webkit-line-clamp: 4; -webkit-box-orient: vertical; font: 400 14px/20px Lato, Arial, sans-serif; }
    .snip__contacts { display: flex; flex: none; flex-direction: column; align-items: flex-start; gap: 12px; width: 236px; padding: 16px; box-sizing: border-box; }
    .snip__avatar { width: 64px; height: 64px; border-radius: 8px; object-fit: cover; }
    .snip__avatar--empty { display: grid; place-items: center; background: var(--surface-neutral-default); }
    .snip__overline { font: 700 10px/16px Lato, Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase; color: var(--text-primary-pressed); }
    .snip__company { font: 700 16px/24px Lato, Arial, sans-serif; }
    .snip__all { padding: 3px 0; font: 400 14px/22px Lato, Arial, sans-serif; color: var(--text-main-default); text-decoration: none; }
    .snip__all:hover { text-decoration: underline; }
    .snip__btns { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 4px; }
    .snip__btns button { height: 36px; }
    .snip__date { position: absolute; right: 24px; bottom: 24px; font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-secondary-default); }
    /* Адаптив меню шапки: что не влезает — прячем целиком, без обрезанных пунктов */
    @media (max-width: 1379px) { .header__promo { display: none; } }
    @media (max-width: 1239px) { .header__item:nth-child(n+10) { display: none; } }
    @media (max-width: 1099px) { .header__item:nth-child(n+8) { display: none; } }
    @media (max-width: 1100px) {
      .snip { flex-wrap: wrap; }
      .snip__contacts { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; }
      .snip__btns { flex-direction: row; width: auto; }
    }
    @media (max-width: 640px) {
      .results { padding-left: 0; padding-right: 0; }
      .snip { padding: 16px; gap: 16px; }
      .snip__photo, .snip__photo--single { width: 100%; height: 280px; }
    }
    /* Дополнения с прода: плашка и иконки на фото, акции, ЖК, скидка, контролы, шапка выдачи */
    .snip__label { position: absolute; top: 16px; left: 16px; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 12px; border-radius: 14px; background: rgba(13, 22, 46, .8); color: #fff; font: 400 14px/20px Lato, Arial, sans-serif; }
    .snip__features { position: absolute; top: 16px; right: 16px; display: flex; gap: 4px; }
    .snip__feature { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; background: rgba(13, 22, 46, .6); color: #fff; }
    .snip__jk { font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-main-default); text-decoration: none; }
    .snip__jk:hover { text-decoration: underline; }
    .snip__muted { color: var(--text-secondary-default); }
    .snip__small { font: 400 12px/16px Lato, Arial, sans-serif; }
    .snip__metro { display: flex; align-items: center; gap: 4px; }
    .snip__price-row { display: flex; align-items: center; gap: 8px; }
    .snip__discount { padding: 2px 8px; border-radius: 12px; background: var(--accent-positive-primary, #0ca84a); color: #fff; font: 400 14px/20px Lato, Arial, sans-serif; }
    .snip__old { color: var(--text-positive-default, #0ca84a); font: 400 14px/20px Lato, Arial, sans-serif; }
    .snip__price-note { color: var(--text-secondary-default); }
    .snip__same { margin-top: -4px; font: 700 14px/20px Lato, Arial, sans-serif; color: var(--text-main-default); text-decoration: none; }
    .snip__badge--super { background: var(--accent-positive-secondary, #e3f7ea); color: var(--text-positive-default, #0b8a3e); }
    .snip__proof { display: inline-flex; align-items: center; gap: 4px; font: 400 12px/16px Lato, Arial, sans-serif; }
    .snip__controls { position: absolute; top: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; }
    .snip__ctrl { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 1px solid var(--stroke-control-default); border-radius: 8px; background: var(--background-primary); cursor: pointer; }
    .snip__ctrl:hover { border-color: var(--stroke-control-hovered, var(--stroke-control-default)); background: var(--surface-neutral-default); }
    /* Шапка выдачи — отдельный «островок», как сниппеты */
    /* Шапка выдачи и сниппеты — один белый островок; размеры текста и кнопок — как на проде */
    .results__panel { background: var(--background-primary); border-radius: 16px; overflow: hidden; }
    .rhead { display: flex; flex-direction: column; gap: 16px; padding: 24px 24px 8px; }
    .rhead__title { margin: 0; font: 700 28px/36px Lato, Arial, sans-serif; letter-spacing: -.5px; color: var(--text-primary-default); }
    .rhead__bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .rhead__found { margin-right: 8px; font: 700 14px/20px Lato, Arial, sans-serif; letter-spacing: -.2px; color: var(--text-primary-default); }
    .rhead__sort { position: relative; }
    .rhead__sort .ms { position: absolute; z-index: 5; top: 100%; left: 0; }
    .rhead__sort > button { background: transparent; }
    .rhead__sort > button:hover { background: var(--surface-main-default); }
    .rhead__rec { display: flex; align-items: baseline; gap: 24px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; padding-top: 4px; }
    .rhead__rec::-webkit-scrollbar { display: none; }
    .rhead__rec-title { flex: none; font: 700 14px/20px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .rhead__rec-item { display: inline-flex; flex: none; gap: 6px; font: 400 14px/20px Lato, Arial, sans-serif; text-decoration: none; }
    .rhead__rec-text { color: var(--text-main-default); }
    .rhead__rec-item:hover .rhead__rec-text { text-decoration: underline; }
    .rhead__rec-n { color: var(--text-secondary-default); }
    .results__panel .results__list { gap: 0; }
    .results__panel .results__more { padding: 8px 0 24px; }
    .results__panel .snip { border-radius: 0; background: none; }
    .results__panel .snip + .snip::before { content: ''; position: absolute; top: 0; left: 24px; right: 24px; height: 1px; background: var(--stroke-divider-default); }
    /* ── Шапка выдачи как на проде: крошки, заголовок, «Найдено», точка входа на карту справа ── */
    .rhead__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
    .rhead__main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .crumbs { display: flex; flex-wrap: wrap; gap: 8px; font: 400 14px/20px Lato, Arial, sans-serif; }
    .crumbs a { color: var(--text-secondary-default); text-decoration: none; }
    .crumbs a:hover { color: var(--text-main-default); }
    .crumbs__sep { color: var(--text-secondary-default); }
    .map-entry { display: flex; flex: none; align-items: center; justify-content: center; width: 270px; height: 112px; padding: 0; border: 0; border-radius: 16px; background: url(./assets/map-entry.svg) center / cover no-repeat; cursor: pointer; }
    .map-entry__btn { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 8px; background: var(--background-primary); color: var(--text-main-default); font: 700 16px/24px Lato, Arial, sans-serif; box-shadow: 0 2px 8px rgba(13, 22, 46, .12); }
    .map-entry:hover .map-entry__btn { color: var(--text-main-hovered, var(--text-main-default)); }
    .snip__sub-extra { font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-secondary-default); }
    /* Баннер Циан-помощника */
    .gpt-banner { display: flex; align-items: center; gap: 16px; margin: 0 24px; padding: 16px 20px; border-radius: 12px; background: var(--accent-main-secondary, #e6f0ff); }
    .gpt-banner__icon { width: 40px; height: 40px; }
    .gpt-banner__text { flex: 1 1 auto; min-width: 0; }
    .gpt-banner__title { font: 700 16px/24px Lato, Arial, sans-serif; color: var(--text-primary-default); }
    .gpt-banner__sub { font: 400 14px/20px Lato, Arial, sans-serif; color: var(--text-secondary-default); }
    /* Пагинация */
    .pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; padding: 16px 24px 28px; }
    .pager__n, .pager__nav { min-width: 40px; height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--text-primary-default); font: 400 16px/24px Lato, Arial, sans-serif; cursor: pointer; }
    .pager__n:hover, .pager__nav:hover:not(:disabled) { background: var(--surface-neutral-default); }
    .pager__n--on { background: var(--accent-main-secondary, #e6f0ff); color: var(--text-main-default); font-weight: 700; }
    .pager__nav { color: var(--text-main-default); font-weight: 700; }
    .pager__nav:disabled { color: var(--text-secondary-default); cursor: default; }
    .pager__gap { padding: 0 8px; color: var(--text-secondary-default); }
    /* SEO-блоки и подвал */
    .seo { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .seo__card { display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: 16px; background: var(--background-primary); }
    .seo__h { margin: 0; font: 700 22px/28px Lato, Arial, sans-serif; letter-spacing: -.5px; color: var(--text-primary-default); }

      // Поисковый запрос: ?q=… — открыть строку с подсказками; ?geo=region|district|metro — открыть окно гео
      var query = useState(params.get('q') || ''), autoOpen = useState(!!params.get('q'));
      var preset = useState({ stamp: 0 });
      var geoOpen = useState(GEO_TABS.some(function (t) { return t.id === params.get('geo'); }) ? params.get('geo') : null);
      function search(text, r) {
        query[1](text); autoOpen[1](false);
        var d = r.deal || deal[0];
        // Корнер 3: запрос противоречит фильтру сделки — приоритет у запроса, сообщаем о переключении
        if (r.deal && r.deal !== deal[0] && toast) toast.open({ type: 'info', text: 'Переключили «' + dealLabel(deal[0]) + '» на «' + dealLabel(r.deal) + '» — как в запросе' });
        if (r.deal && r.deal !== deal[0]) changeDeal(r.deal);
        if (r.types) types[1](r.types);
        else if (!types[0].every(function (id) { return allowed(d, id); })) types[1](DEFAULT_TYPES[d]);
        var ng = null;
        if (r.region) ng = Object.assign({}, geo[0], { region: r.region, district: [], metro: [] });
        else if (r.district) ng = Object.assign({}, geo[0], { district: r.district });
        if (r.metro) ng = Object.assign({}, ng || geo[0], { metro: r.metro });
        if (ng) geo[1](ng);
        preset[1]({ rooms: r.rooms, repair: r.repair, stamp: Date.now() });
        TL.log('search_apply', text + '|' + JSON.stringify(r));
      }
      var sort = useState('default'), loading = useState(true), page = useState(1);
      var fstate = useState({ sig: '', rooms: [], price: {} }), fsig = [fstate[0].sig];  // быстрые фильтры (комнатность, цена, категории, «Все фильтры»)
      // Вид: выдача списком или карта (?view=map); точка входа на карту — карточка в шапке выдачи
      var view = useState(params.get('view') === 'map' ? 'map' : 'list');
      function openMap() { view[1]('map'); window.scrollTo(0, 0); }
      // Липкая шапка: 'top' — в начале страницы, 'hidden' — скроллим вниз, 'pinned' — скроллим вверх (шапка с фильтрами видна)
      var bar = useState('top'), barRef = useRef(null);
      useEffect(function () {
        var last = window.scrollY;
        function update() {
          var y = window.scrollY, hgt = barRef.current ? barRef.current.offsetHeight : 200, dy = y - last;
          // Пока открыт поиск — шапку не прячем
          if (document.body.classList.contains('search-active')) { last = y; return; }
          if (y <= hgt) bar[1]('top');
          else if (dy > 4) bar[1]('hidden');
          else if (dy < -4) bar[1]('pinned');
          last = y;
        }
        window.addEventListener('scroll', update, { passive: true });
        return function () { window.removeEventListener('scroll', update); };
      }, []);
      // Гео живёт на странице: при смене сделки не сбрасывается
      // Диплинки для показа нагруженной строки: ?region=Москва,Московская область&district=Арбат,Тверской&rooms=1,2,3,4,5&price=680000000-7899999999
      var listParam = function (k) { return (params.get(k) || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean); };
      var geo = useState({ region: listParam('region').length ? listParam('region') : GEO_DEFAULT, district: listParam('district'), rdistrict: [], metro: [], metroTime: null, address: [], jk: listParam('jk'), dev: [], highway: listParam('highway') });

      // Тип и сделка — в адресе страницы, чтобы ссылкой можно было поделиться
      useEffect(function () {
        var q = new URLSearchParams(location.search);
        q.set('type', isMixedFlat(types[0]) ? 'flat' : typeKey); q.set('deal', deal[0]);
        if (query[0]) q.set('q', query[0]); else q.delete('q');
        if (view[0] === 'map') q.set('view', 'map'); else q.delete('view');
        history.replaceState(null, '', '?' + q.toString().replace(/%2C/g, ','));
      }, [typeKey, deal[0], query[0], view[0]]);

      // Имитация загрузки при смене фильтров
      useEffect(function () {
        loading[1](true);
        var t = setTimeout(function () { loading[1](false); }, 700);
        return function () { clearTimeout(t); };
      }, [typeKey, deal[0], sort[0], geo[0], preset[0].stamp, page[0], fsig[0]]);

      // Число объявлений для шапки — правдоподобное, меняется от фильтров и запроса
      var filtered = !!query[0] || !!fsig[0] || geo[0].district.length > 0 || geo[0].metro.length > 0 || (geo[0].jk || []).length > 0 || typeKey !== 'newbuilding,secondary';
      var empty = false; // пересчитывается ниже, когда известна отфильтрованная выдача
      // Сброс из пустой выдачи: убрать запрос, комнатность, цену или гео; «Сбросить всё» — всё, кроме сделки и типа
      function removeEmptyTag(t) {
        if (t.kind === 'q') { query[1](''); preset[1]({ stamp: Date.now() }); }
        if (t.kind === 'rooms') preset[1]({ rooms: [], stamp: Date.now() });
        if (t.kind === 'price') preset[1]({ price: { from: null, to: null, per: 'all' }, stamp: Date.now() });
        if (t.kind === 'geo') { var n = removeGeo(geo[0], t.o); if (!n.region.length) n.region = GEO_DEFAULT; geo[1](n); }
      }
      function resetEmpty() {
        query[1]('');
        preset[1]({ rooms: [], price: { from: null, to: null, per: 'all' }, stamp: Date.now() });
        geo[1]({ region: GEO_DEFAULT, district: [], rdistrict: [], metro: [], metroTime: null, address: [], jk: [], dev: [], highway: [] });
        if (CORNER === 'empty') { var q = new URLSearchParams(location.search); q.delete('corner'); location.search = q.toString(); }
      }
      function fakeTotal() {
        if (empty) return 0;
        return items.length; // юзтест: честное число из тестового датасета
        if (deal[0] === 'sale' && geo[0].region.join() === 'Москва' && !filtered) return PROD_STATS.total;
        var k = (typeKey + deal[0] + query[0] + fsig[0] + geo[0].region.join() + geo[0].district.length + geo[0].metro.length).split('').reduce(function (a, ch) { return (a * 31 + ch.charCodeAt(0)) % 100000; }, 7);
        var base = deal[0] === 'sale' ? 94952 : deal[0] === 'rent' ? 28417 : 6230;
        if (query[0] || geo[0].district.length || geo[0].metro.length) base = Math.round(base / 6);
        if (fsig[0]) base = Math.round(base / 3);
        return Math.max(12, Math.round(base * (0.8 + (k % 400) / 1000)));
      }
      // Юзтест: выдача реально фильтруется по сделке/типу, комнатам, цене, ремонту и метро (data/test-listings.js)
      TEST_METRO = metroNames(geo[0].metro);
      function testFits(l) {
        return fitsState(l, { deal: deal[0], types: types[0], rooms: fstate[0].rooms, price: fstate[0].price, applied: fstate[0].applied, metro: TEST_METRO });
      }
      var items = LISTINGS.filter(testFits).sort(function (a, b) {
        if (sort[0] === 'price_asc') return a.price.sale - b.price.sale;
        if (sort[0] === 'price_desc') return b.price.sale - a.price.sale;
        if (sort[0] === 'area_desc') return b.area - a.area;
        return 0;
      });
      empty = noResults(query[0]) || items.length === 0;
      useEffect(function () { loadMetro().catch(function () {}); }, []);

      // Открытие объявления и финиш задания
      var detail = useState(null), done = useState(null), backY = useRef(0);
      function matchTask(l, task) {
        var ok = deal[0] === 'sale' && l.kind === 'secondary' && roomsOf(l) === '2' && !!l.repair && l.repair !== 'Без ремонта';
        return task === '2' ? ok && l.metro === 'Сокол' : ok;
      }
      function openListing(l, how) {
        var pos = items.indexOf(l) + 1;
        TL.log('listing_open', l.id + '|' + how + '|pos:' + pos + '|deal:' + deal[0] + '|t1:' + (matchTask(l, '1') ? 1 : 0) + '|t2:' + (matchTask(l, '2') ? 1 : 0));
        backY.current = window.scrollY; detail[1](l); TL.setPage('detail'); window.scrollTo(0, 0);
      }
      // Ответ респондента: «В избранное» на странице объявления — задание завершено (любое объявление; правильность — в данных)
      function answerListing(l) {
        var m = 't1:' + (matchTask(l, '1') ? 1 : 0) + '|t2:' + (matchTask(l, '2') ? 1 : 0);
        TL.log('fav_add', l.id + '|detail|deal:' + deal[0] + '|' + m);
        if (TL.task) { TL.finish('id:' + l.id + '|' + m); done[1](TL.summary()); TL.setPage('finish'); }
      }
      function closeListing() {
        TL.log('detail_back', detail[0].id); detail[1](null); TL.setPage('results');
        setTimeout(function () { window.scrollTo(0, backY.current); });
      }
      // Любое изменение поиска: пишем состояние и число результатов; открытое объявление закрываем
      var stateKey = JSON.stringify({ deal: deal[0], types: types[0], q: query[0], rooms: fstate[0].rooms, price: fstate[0].price,
        repair: repairSel(fstate[0].applied), kind: (fstate[0].applied || {})['Тип объекта#0'] || '', metro: metroNames(geo[0].metro), sort: sort[0] });
      // Пишем, когда состояние устоялось (применение запроса меняет сделку, комнаты и ремонт за несколько рендеров)
      useEffect(function () {
        var t = setTimeout(function () { TL.log('results', items.length + '|' + stateKey); }, 500);
        if (detail[0]) { detail[1](null); TL.setPage('results'); }
        return function () { clearTimeout(t); };
      }, [stateKey]);

      var topbar = h('div', { className: 'topbar' + (view[0] === 'list' && bar[0] === 'hidden' ? ' topbar--hidden' : view[0] === 'list' && bar[0] === 'pinned' ? ' topbar--pinned' : ''), ref: barRef },
          h(Header, { active: params.get('section') }),
          // key: при смене сделки цена, комнатность и категории сбрасываются
          h(Filters, { key: deal[0], types: types[0], onTypes: types[1], deal: deal[0], onDeal: changeDeal, geo: geo[0], onGeo: geo[1],
            query: query[0], autoOpen: autoOpen[0], onSearch: search, loading: loading[0], preset: preset[0], geoOpen: geoOpen[0], onGeoOpen: geoOpen[1], onSig: fstate[1], hideTags: empty && !loading[0] && view[0] === 'list' }));
      if (view[0] === 'map') return h('div', { className: 'page page--map' }, topbar,
        h(MapView, { deal: deal[0], total: fakeTotal(), empty: empty, onReset: resetEmpty, items: items, geo: geo[0], loading: loading[0],
          sig: [typeKey, deal[0], query[0], JSON.stringify(geo[0]), fsig[0], preset[0].stamp].join('#'), onList: function () { view[1]('list'); } }));

      if (done[0]) return h('div', { className: 'page' }, h(TaskDone, { s: done[0] }));
      if (detail[0]) return h('div', { className: 'page' }, topbar, h(ListingDetail, { data: detail[0], deal: deal[0], onBack: closeListing, onFav: answerListing }));
      return h('div', { className: 'page' },
        // Шапка + строка фильтров: при скролле вниз уезжают, при скролле вверх возвращаются и фиксируются сверху
        topbar,
        h('div', { className: 'results' },
          h('div', { className: 'results__panel' },
          h(ResultsHead, { deal: deal[0], types: types[0], geo: geo[0], loading: loading[0], total: fakeTotal(), filtered: filtered, empty: empty && !loading[0],
            sort: sort[0], onSort: sort[1], onMap: openMap, onRecommend: function (r) { search(query[0], r); } }),
          loading[0]
            ? h('div', { className: 'results__list' }, h(CardSkeleton), h(CardSkeleton))
            : empty ? h(EmptyResults, { query: query[0], f: fstate[0], geo: geo[0], items: items, deal: deal[0], onRemove: removeEmptyTag, onReset: resetEmpty })
            : h('div', { className: 'results__list' },
                items.map(function (l, i) {
                  return h(React.Fragment, { key: l.id }, h(ListingCard, { data: l, deal: deal[0], onOpen: openListing }), i === 2 && h(GptBanner));
                })),
          // юзтест: все результаты на одной странице, пагинации нет
          null),
          h(SeoBlocks))

    }

    ReactDOM.createRoot(document.getElementById('ds-root')).render(
      h(K.UiKitRoot, { theme: theme }, h(K.UiKitToastsContextProvider || React.Fragment, null, h(Page))));
  })();
  </script>
